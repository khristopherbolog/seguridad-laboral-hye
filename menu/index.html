<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#161616">
  <meta id="meta-desc" name="description" content="Haz tu pedido online · MiMenú">
  <title id="page-title">Menú · MiMenú</title>
  <link rel="stylesheet" href="../css/restaurante.css">
  <style>
    .not-found {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      min-height: 100vh; text-align: center; padding: 24px; gap: 12px;
      background: #161616; color: #f1f5f9;
    }
    .not-found h1 { font-size: 48px; }
    .not-found p  { font-size: 16px; color: #94a3b8; }
    .not-found a  { color: #25D366; font-weight: 700; }
  </style>
</head>
<body>

<div class="loading-screen" id="loading" style="display:flex;align-items:center;justify-content:center;min-height:100vh;background:#161616;flex-direction:column;gap:14px;color:#94a3b8;font-family:sans-serif;font-size:14px">
  <div style="width:24px;height:24px;border:2px solid #2a2a2a;border-top-color:#25D366;border-radius:50%;animation:spin 0.7s linear infinite"></div>
  <span>Cargando menú…</span>
  <style>@keyframes spin{to{transform:rotate(360deg)}}</style>
</div>

<div id="not-found" class="not-found" style="display:none">
  <h1>🍽️</h1>
  <strong style="font-size:20px">Restaurante no encontrado</strong>
  <p>El enlace que seguiste no existe o ya no está disponible.</p>
  <a href="../">Volver a MiMenú</a>
</div>

<!-- Firebase SDKs -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="../js/firebase-config.js"></script>
<script src="../js/restaurante.js"></script>

<script>
(function () {
  /* Leer slug del query param ?r=slug */
  const params = new URLSearchParams(window.location.search);
  const slug   = (params.get('r') || '').trim().toLowerCase();

  if (!slug) {
    showNotFound();
    return;
  }

  const db = firebase.firestore();

  db.collection('restaurantes')
    .where('slug', '==', slug)
    .limit(1)
    .get()
    .then(function (snap) {
      if (snap.empty) { showNotFound(); return; }
      const data = snap.docs[0].data();

      /* Montar el objeto RESTAURANTE que espera restaurante.js */
      window.RESTAURANTE = {
        nombre:      data.nombre      || 'Restaurante',
        descripcion: data.descripcion || '',
        whatsapp:    data.whatsapp    || '',
        horario:     data.horario     || '',
        abierto:     data.abierto     !== false,
        moneda:      data.moneda      || 'B/.',
        cover:       data.cover       || '',
        categorias:  data.categorias  || [],
      };

      /* Actualizar título y meta */
      document.title = window.RESTAURANTE.nombre + ' · MiMenú';
      document.getElementById('meta-desc').content =
        'Haz tu pedido online — ' + window.RESTAURANTE.nombre;

      document.getElementById('loading').style.display = 'none';

      /* Disparar render: restaurante.js espera DOMContentLoaded
         o se llama directamente si el DOM ya está listo         */
      if (typeof window.__mimenu_render === 'function') {
        window.__mimenu_render();
      }
    })
    .catch(function (err) {
      console.error(err);
      showNotFound();
    });

  function showNotFound() {
    document.getElementById('loading').style.display  = 'none';
    document.getElementById('not-found').style.display = 'flex';
  }
})();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0f1117">
  <title>Iniciar sesión · MiMenú</title>
  <link rel="stylesheet" href="../css/app.css">
</head>
<body>

<div class="auth-wrap">
  <div class="auth-box">
    <a href="../" class="auth-logo">Mi<span>Menú</span></a>

    <div class="auth-title">Bienvenido</div>
    <div class="auth-subtitle">Accede a tu panel de restaurante</div>

    <div id="alert" class="alert alert-error">
      <span>⚠️</span>
      <span id="alert-msg">Error al iniciar sesión</span>
    </div>

    <form id="login-form">
      <div class="form-group">
        <label class="form-label" for="email">Correo electrónico</label>
        <input id="email" class="form-input" type="email" placeholder="tu@correo.com" autocomplete="email" required>
      </div>
      <div class="form-group">
        <label class="form-label" for="password">Contraseña</label>
        <input id="password" class="form-input" type="password" placeholder="••••••••" autocomplete="current-password" required>
      </div>
      <button type="submit" class="btn btn-primary btn-full" id="btn-submit">
        Iniciar sesión
      </button>
    </form>

    <div class="auth-footer">
      ¿No tienes cuenta?
      <a href="register.html">Regístrate gratis</a>
    </div>
  </div>
</div>

<!-- Firebase SDKs (compat v9) -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="../js/firebase-config.js"></script>

<script>
(function () {
  const auth = firebase.auth();
  const db   = firebase.firestore();

  /* Si ya está logueado, redirigir */
  auth.onAuthStateChanged(function (user) {
    if (!user) return;
    db.collection('admins').doc(user.uid).get().then(function (snap) {
      window.location.href = snap.exists ? '../admin/' : '../dashboard/';
    });
  });

  /* Form submit */
  document.getElementById('login-form').addEventListener('submit', async function (e) {
    e.preventDefault();
    const btn   = document.getElementById('btn-submit');
    const email = document.getElementById('email').value.trim();
    const pass  = document.getElementById('password').value;

    btn.disabled = true;
    btn.textContent = 'Entrando…';
    hideAlert();

    try {
      await auth.signInWithEmailAndPassword(email, pass);
      /* onAuthStateChanged handles redirect */
    } catch (err) {
      showAlert(friendlyError(err.code));
      btn.disabled = false;
      btn.textContent = 'Iniciar sesión';
    }
  });

  function showAlert(msg) {
    const a = document.getElementById('alert');
    document.getElementById('alert-msg').textContent = msg;
    a.classList.add('visible');
  }
  function hideAlert() {
    document.getElementById('alert').classList.remove('visible');
  }
  function friendlyError(code) {
    const map = {
      'auth/user-not-found':  'No existe una cuenta con ese correo.',
      'auth/wrong-password':  'Contraseña incorrecta.',
      'auth/invalid-email':   'El correo no es válido.',
      'auth/too-many-requests': 'Demasiados intentos. Espera unos minutos.',
      'auth/invalid-credential': 'Correo o contraseña incorrectos.',
    };
    return map[code] || 'Ocurrió un error. Intenta de nuevo.';
  }
})();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0f1117">
  <title>Crear cuenta · MiMenú</title>
  <link rel="stylesheet" href="../css/app.css">
</head>
<body>

<div class="auth-wrap">
  <div class="auth-box">
    <a href="../" class="auth-logo">Mi<span>Menú</span></a>

    <div class="auth-title">Crea tu cuenta</div>
    <div class="auth-subtitle">Empieza gratis, sin tarjeta de crédito</div>

    <div id="alert" class="alert alert-error">
      <span>⚠️</span>
      <span id="alert-msg"></span>
    </div>

    <form id="reg-form">
      <div class="form-group">
        <label class="form-label" for="nombre">Nombre del restaurante</label>
        <input id="nombre" class="form-input" type="text" placeholder="Ej: El Rincón Nica" required>
      </div>

      <div class="form-group">
        <label class="form-label" for="slug">Tu enlace público</label>
        <div style="display:flex;gap:6px;align-items:center">
          <span style="font-size:12px;color:var(--text-faint);white-space:nowrap">mimenu.app/m/</span>
          <input id="slug" class="form-input" type="text" placeholder="rinconnica"
                 pattern="[a-z0-9\-]{3,30}" title="Solo letras minúsculas, números y guiones (3-30 caracteres)" required>
        </div>
        <div class="form-hint">Solo letras minúsculas, números y guiones. Ej: <code>el-rincon-nica</code></div>
        <div class="form-error" id="slug-error">Ese enlace ya está en uso. Prueba otro.</div>
      </div>

      <div class="form-group">
        <label class="form-label" for="email">Correo electrónico</label>
        <input id="email" class="form-input" type="email" placeholder="tu@correo.com" autocomplete="email" required>
      </div>

      <div class="form-group">
        <label class="form-label" for="password">Contraseña</label>
        <input id="password" class="form-input" type="password" placeholder="Mínimo 8 caracteres" autocomplete="new-password" minlength="8" required>
        <div class="form-hint">Mínimo 8 caracteres</div>
      </div>

      <button type="submit" class="btn btn-primary btn-full" id="btn-submit">
        Crear cuenta
      </button>
    </form>

    <div class="auth-footer">
      ¿Ya tienes cuenta?
      <a href="login.html">Iniciar sesión</a>
    </div>
  </div>
</div>

<!-- Firebase SDKs -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="../js/firebase-config.js"></script>

<script>
(function () {
  const auth = firebase.auth();
  const db   = firebase.firestore();

  /* Normalizar slug en tiempo real */
  document.getElementById('slug').addEventListener('input', function () {
    this.value = this.value.toLowerCase().replace(/[^a-z0-9-]/g, '-').replace(/-+/g, '-');
    document.getElementById('slug-error').classList.remove('visible');
  });

  document.getElementById('reg-form').addEventListener('submit', async function (e) {
    e.preventDefault();
    const btn    = document.getElementById('btn-submit');
    const nombre = document.getElementById('nombre').value.trim();
    const slug   = document.getElementById('slug').value.trim();
    const email  = document.getElementById('email').value.trim();
    const pass   = document.getElementById('password').value;

    btn.disabled = true;
    btn.textContent = 'Creando cuenta…';
    hideAlert();

    try {
      /* Verificar slug único */
      const slugSnap = await db.collection('restaurantes').where('slug', '==', slug).limit(1).get();
      if (!slugSnap.empty) {
        document.getElementById('slug-error').classList.add('visible');
        btn.disabled = false;
        btn.textContent = 'Crear cuenta';
        return;
      }

      /* Crear usuario en Firebase Auth */
      const cred = await auth.createUserWithEmailAndPassword(email, pass);
      const uid  = cred.user.uid;

      /* Guardar perfil en Firestore */
      const batch = db.batch();

      batch.set(db.collection('users').doc(uid), {
        email,
        displayName: nombre,
        slug,
        plan: 'gratis',
        activo: true,
        createdAt: firebase.firestore.FieldValue.serverTimestamp(),
      });

      batch.set(db.collection('restaurantes').doc(uid), {
        nombre,
        descripcion: '',
        whatsapp: '',
        horario: '',
        abierto: false,
        moneda: 'B/.',
        cover: '',
        slug,
        categorias: [],
        ownerUid: uid,
        updatedAt: firebase.firestore.FieldValue.serverTimestamp(),
      });

      await batch.commit();
      window.location.href = '../dashboard/';

    } catch (err) {
      showAlert(friendlyError(err.code));
      btn.disabled = false;
      btn.textContent = 'Crear cuenta';
    }
  });

  function showAlert(msg) {
    const a = document.getElementById('alert');
    document.getElementById('alert-msg').textContent = msg;
    a.classList.add('visible');
  }
  function hideAlert() {
    document.getElementById('alert').classList.remove('visible');
  }
  function friendlyError(code) {
    const map = {
      'auth/email-already-in-use': 'Ese correo ya tiene una cuenta registrada.',
      'auth/invalid-email':        'El correo no es válido.',
      'auth/weak-password':        'La contraseña es muy débil. Usa al menos 8 caracteres.',
    };
    return map[code] || 'Ocurrió un error. Intenta de nuevo.';
  }
})();
</script>
</body>
</html>
